<svg width="900" height="250" viewBox="0 0 900 250" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Matrix-style background -->
    <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#161b22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21262d;stop-opacity:1" />
    </linearGradient>
    
    <!-- Neon glow effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Terminal cursor blink -->
    <animate id="blink" attributeName="opacity" values="1;0;1" dur="1.5s" repeatCount="indefinite"/>
  </defs>
  
  <!-- Background -->
  <rect width="900" height="250" fill="url(#matrixBg)"/>
  
  <!-- Code Matrix Background -->
  <g opacity="0.1" font-family="monospace" font-size="12" fill="#00ff41">
    <text x="50" y="30">const developer = {</text>
    <text x="70" y="50">name: 'Thang Huynh Duc',</text>
    <text x="70" y="70">skills: ['React', 'Node.js'],</text>
    <text x="70" y="90">passion: 'fullstack'</text>
    <text x="50" y="110">};</text>
    
    <text x="600" y="40">function buildFuture() {</text>
    <text x="620" y="60">return 'Innovation';</text>
    <text x="600" y="80">}</text>
    
    <text x="300" y="180">// Always learning, always coding</text>
    <text x="300" y="200">while(true) { improve(); }</text>
  </g>
  
  <!-- Terminal Window -->
  <g transform="translate(50, 30)">
    <!-- Terminal Header -->
    <rect x="0" y="0" width="800" height="35" rx="8" fill="#2d333b" stroke="#444c56" stroke-width="1"/>
    <circle cx="20" cy="17.5" r="6" fill="#ff5f56"/>
    <circle cx="40" cy="17.5" r="6" fill="#ffbd2e"/>
    <circle cx="60" cy="17.5" r="6" fill="#27ca3f"/>
    <text x="400" y="23" text-anchor="middle" font-family="monospace" font-size="12" fill="#7d8590">thang@developer:~</text>
    
    <!-- Terminal Body -->
    <rect x="0" y="35" width="800" height="150" fill="#0d1117" stroke="#444c56" stroke-width="1"/>
    
    <!-- Terminal Content -->
    <g font-family="monospace" font-size="14">
      <!-- Command line with typing animation -->
      <text x="20" y="60" fill="#7c3aed">thang@dev:~$</text>
      <text x="120" y="60" fill="#00ff41">
        Hello
        <animate attributeName="textLength" values="0;42;42" dur="2s" repeatCount="indefinite"/>
      </text>
      
      <!-- Response -->
      <text x="20" y="80" fill="#fbbf24">Software Engineer </text>
      
      <!-- New command -->
      <text x="20" y="110" fill="#7c3aed">thang@dev:~$</text>
      <text x="120" y="110" fill="#00ff41">
        tech.js
        <animate attributeName="textLength" values="0;72;72" dur="3s" begin="2s" repeatCount="indefinite"/>
      </text>
      
      <!-- Skills output -->
      <text x="20" y="130" fill="#06b6d4">// Languages: JavaScript, TypeScript</text>
      <text x="20" y="150" fill="#10b981">// Framework: Node.js, Express, NestJs, React/NextJs, MongoDB, PostgreSQL</text>
      
      <!-- Cursor -->
      <text x="20" y="170" fill="#00ff41" opacity="1">
        █
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </text>
    </g>
  </g>
  
  <!-- Floating Code Elements -->
  <g opacity="0.6">
    <!-- Floating brackets -->
    <text x="20" y="200" font-family="monospace" font-size="24" fill="#7c3aed" filter="url(#neonGlow)">
      { }
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="4s" repeatCount="indefinite"/>
    </text>
    
    <!-- Floating tags -->
    <text x="870" y="50" font-family="monospace" font-size="20" fill="#06b6d4" filter="url(#neonGlow)" text-anchor="end">
      &lt;/&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0; -5,5; 0,0" dur="3s" repeatCount="indefinite"/>
    </text>
    
    <!-- Floating arrow function -->
    <text x="870" y="220" font-family="monospace" font-size="18" fill="#10b981" filter="url(#neonGlow)" text-anchor="end">
      =&gt;
      <animateTransform attributeName="transform" type="translate" values="0,0; -8,-3; 0,0" dur="5s" repeatCount="indefinite"/>
    </text>
  </g>
  
  <!-- Animated Circuit Lines -->
  <g stroke="#444c56" stroke-width="2" fill="none" opacity="0.7">
    <!-- Top circuit -->
    <path d="M 0 0 L 100 0 L 120 20 L 200 20">
      <animate attributeName="stroke" values="#444c56;#00ff41;#444c56" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Bottom circuit -->
    <path d="M 900 250 L 800 250 L 780 230 L 700 230">
      <animate attributeName="stroke" values="#444c56;#7c3aed;#444c56" dur="6s" repeatCount="indefinite"/>
    </path>
    
    <!-- Side circuits -->
    <path d="M 0 125 L 30 125 L 30 100 L 50 100">
      <animate attributeName="stroke" values="#444c56;#06b6d4;#444c56" dur="3s" repeatCount="indefinite"/>
    </path>
    
    <path d="M 900 125 L 870 125 L 870 150 L 850 150">
      <animate attributeName="stroke" values="#444c56;#fbbf24;#444c56" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Data Flow Particles -->
  <g>
    <circle r="3" fill="#00ff41" opacity="0.8">
      <animateMotion dur="8s" repeatCount="indefinite" path="M 0 20 Q 450 50 900 20"/>
    </circle>
    <circle r="2" fill="#7c3aed" opacity="0.7">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 900 230 Q 450 200 0 230"/>
    </circle>
    <circle r="2.5" fill="#06b6d4" opacity="0.6">
      <animateMotion dur="10s" repeatCount="indefinite" path="M 50 100 Q 450 125 850 150"/>
    </circle>
  </g>
  
  <!-- Loading Bar Animation -->
  <g transform="translate(50, 210)">
    <rect x="0" y="0" width="800" height="4" fill="#21262d" rx="2"/>
    <rect x="0" y="0" width="0" height="4" fill="#00ff41" rx="2">
      <animate attributeName="width" values="0;800;0" dur="8s" repeatCount="indefinite"/>
    </rect>
    <text x="400" y="-8" text-anchor="middle" font-family="monospace" font-size="10" fill="#7d8590">
      Loading awesome projects...
    </text>
  </g>
</svg>